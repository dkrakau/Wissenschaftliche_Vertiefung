name: "✅ Daily Report"
description: "Log one or more tasks you completed today, each with its own time spent"
title: "Daily Report: "
labels: ["worklog"]
body:
  - type: markdown
    attributes:
      value: >
        The title above is optional to edit — a workflow will automatically set it to
        `Daily Report – <date>` based on the Date field below. Any extra text you leave
        after "Daily Report: " is kept as a short summary, e.g. `Daily Report – 2026-07-27 – bugfixes & PR review`.

  - type: input
    id: date
    attributes:
      label: Date
      description: Which day does this report cover?
      placeholder: "YYYY-MM-DD"
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: >
        List every task you worked on today, one per line, using the format
        `description | category | hours`. Category must be one of: organisation,
        meeting, development, research, writing. Example is pre-filled below —
        replace it with your own entries. A "Total Hours" field will be added to
        this issue automatically once submitted.
      value: |
        - Write wiki entries | organisation | 2.5
        - Zoom call 07.05. | meeting | 1
        - Research on vector databases | research | 3
        - Checking API calls | development | 1
        - Write on survey | writing | 3
      render: markdown
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: Anything else worth mentioning about today's work.
    validations:
      required: false
