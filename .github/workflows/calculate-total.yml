name: Calculate Total Hours

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  calculate-total:
    # Runs when a daily report is created or edited.
    # The sender check prevents an infinite loop: this workflow edits the issue body,
    # which would otherwise re-trigger itself.
    if: >
      contains(github.event.issue.labels.*.name, 'worklog') &&
      github.event.sender.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Add or update Total Hours field
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";

            // Capture the Tasks section without consuming the following header,
            // so we know exactly where to insert the Total Hours field if needed.
            const tasksSectionMatch = body.match(/### Tasks\s*\n+([\s\S]*?)(?=\n### |$)/i);
            if (!tasksSectionMatch) {
              console.log("No Tasks section found, aborting.");
              return;
            }

            const lines = tasksSectionMatch[1].split("\n");
            let total = 0;
            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed.startsWith("-")) continue;
              const content = trimmed.replace(/^-\s*/, "");
              const parts = content.split("|");
              if (parts.length < 2) continue;
              const hours = parseFloat(parts[1].trim().replace(",", "."));
              if (!isNaN(hours)) total += hours;
            }

            // --- Total Hours field in the body ---
            const totalSectionRegex = /### Total Hours\s*\n+([\d.,]+)\s*h?\s*/i;
            const existingMatch = body.match(totalSectionRegex);

            let newBody = body;
            if (existingMatch) {
              const currentValue = parseFloat(existingMatch[1].replace(",", "."));
              if (currentValue !== total) {
                newBody = body.replace(totalSectionRegex, `### Total Hours\n\n${total} h\n`);
              }
            } else {
              const insertPos = tasksSectionMatch.index + tasksSectionMatch[0].length;
              newBody =
                body.slice(0, insertPos) +
                `\n\n### Total Hours\n\n${total} h\n` +
                body.slice(insertPos);
            }

            // --- Title, normalized from the Date field ---
            const dateMatch = body.match(/### Date\s*\n+(.+)/i);
            const dateStr = dateMatch ? dateMatch[1].trim() : issue.created_at.split("T")[0];

            // Strip any prior "Daily Report" prefix / date / separators to recover
            // whatever optional summary text the person typed, so it survives re-runs.
            let summary = issue.title
              .replace(/^\[?Daily Report\]?:?\s*/i, "")
              .replace(/^[-–]\s*/, "")
              .replace(/^\d{4}-\d{2}-\d{2}\s*/, "")
              .replace(/^[-–]\s*/, "")
              .trim();

            const newTitle = summary
              ? `Daily Report – ${dateStr} – ${summary}`
              : `Daily Report – ${dateStr}`;

            const updatePayload = {};
            if (newBody !== body) updatePayload.body = newBody;
            if (newTitle !== issue.title) updatePayload.title = newTitle;

            if (Object.keys(updatePayload).length === 0) {
              console.log("Nothing to update, skipping.");
              return;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              ...updatePayload,
            });
